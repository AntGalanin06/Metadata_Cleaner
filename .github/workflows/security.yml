name: Security Scan

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.1'

permissions:
  contents: read
  security-events: write

jobs:
  # Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-security-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --with dev
    
    - name: Run Safety check for known vulnerabilities
      run: |
        echo "🛡️ Checking for known security vulnerabilities..."
        poetry run safety check --json --output safety-report.json || true
        poetry run safety check --short-report || true
    
    - name: Upload vulnerability reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vulnerability-reports-${{ github.run_id }}
        path: |
          safety-report.json
        retention-days: 30

  # Static code security analysis
  code-security:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-bandit-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --with dev
    
    - name: Run Bandit security linter
      run: |
        echo "🔒 Running Bandit security analysis..."
        poetry run pip install bandit[toml]
        poetry run bandit -r metadata_cleaner/ -f json -o bandit-report.json || true
        poetry run bandit -r metadata_cleaner/ -ll --severity-level medium || true
    
    - name: Run Semgrep static analysis
      run: |
        echo "🔎 Running Semgrep static analysis..."
        pip install semgrep
        semgrep --config=auto --json --output=semgrep-report.json metadata_cleaner/ || true
        semgrep --config=auto metadata_cleaner/ || true
    
    - name: Upload security analysis reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-analysis-reports-${{ github.run_id }}
        path: |
          bandit-report.json
          semgrep-report.json
        retention-days: 30

  # Secrets scanning
  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for secret scanning
    
    - name: Run TruffleHog secrets scan
      run: |
        echo "🔐 Scanning for secrets and sensitive information..."
        docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:latest filesystem /pwd --json > trufflehog-report.json || true
        
        # Show results (but don't fail the build for backwards compatibility)
        if [ -s trufflehog-report.json ]; then
          echo "⚠️ TruffleHog found potential secrets:"
          cat trufflehog-report.json | jq -r '.SourceMetadata.Data.Filesystem.file' | sort -u || true
        else
          echo "✅ No secrets detected by TruffleHog"
        fi
    
    - name: Upload secrets scan report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: secrets-scan-report-${{ github.run_id }}
        path: trufflehog-report.json
        retention-days: 30

  # Security summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security, secrets-scan]
    if: always()
    
    steps:
    - name: Download all security reports
      uses: actions/download-artifact@v4
      with:
        path: security-reports/
    
    - name: Generate security summary
      run: |
        echo "🛡️ Security Scan Summary" > security-summary.md
        echo "========================" >> security-summary.md
        echo "" >> security-summary.md
        
        echo "**Scan Date:** $(date)" >> security-summary.md
        echo "**Branch:** ${{ github.ref_name }}" >> security-summary.md
        echo "**Commit:** ${{ github.sha }}" >> security-summary.md
        echo "" >> security-summary.md
        
        echo "## Results" >> security-summary.md
        echo "" >> security-summary.md
        echo "- **Dependency Scan:** ${{ needs.dependency-scan.result }}" >> security-summary.md
        echo "- **Code Security:** ${{ needs.code-security.result }}" >> security-summary.md
        echo "- **Secrets Scan:** ${{ needs.secrets-scan.result }}" >> security-summary.md
        echo "" >> security-summary.md
        
        if [ "${{ needs.dependency-scan.result }}" = "success" ] && 
           [ "${{ needs.code-security.result }}" = "success" ] && 
           [ "${{ needs.secrets-scan.result }}" = "success" ]; then
          echo "✅ **Overall Status:** PASSED" >> security-summary.md
          echo "" >> security-summary.md
          echo "All security scans completed successfully with no critical issues found." >> security-summary.md
        else
          echo "❌ **Overall Status:** FAILED" >> security-summary.md
          echo "" >> security-summary.md
          echo "One or more security scans detected issues that require attention." >> security-summary.md
        fi
        
        echo "" >> security-summary.md
        echo "## Recommendations" >> security-summary.md
        echo "" >> security-summary.md
        echo "1. Review all security reports in the artifacts" >> security-summary.md
        echo "2. Address any high or critical severity findings" >> security-summary.md
        echo "3. Update dependencies regularly to patch known vulnerabilities" >> security-summary.md
        echo "4. Follow secure coding practices" >> security-summary.md
        
        echo "Security Summary:"
        cat security-summary.md
    
    - name: Upload security summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary-${{ github.run_id }}
        path: security-summary.md
        retention-days: 30