name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install project dependencies
        run: poetry install --no-root

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build Windows executable
        run: poetry run python build.py

      - name: Install NSIS
        run: |
          Invoke-WebRequest -Uri "https://nsis.sourceforge.io/mediawiki/images/4/4a/Nsis-3.08-setup.exe" -OutFile "nsis-setup.exe"
          Start-Process -FilePath "nsis-setup.exe" -ArgumentList "/S" -Wait
        shell: pwsh

      - name: Create Windows installer
        run: '& "C:Program Files (x86)NSISmakensis.exe" "${{ github.workspace }}/installer_windows_universal.nsi"'
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            MetadataCleaner-Windows-*.exe
            dist/

  build-macos:
    runs-on: macos-latest
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install project dependencies
        run: poetry install --no-root

      - name: Install PyInstaller and create-dmg
        run: |
          poetry run pip install pyinstaller
          brew install create-dmg

      - name: Build macOS app
        run: poetry run python build.py

      - name: Create DMG
        run: |
          chmod +x "${{ github.workspace }}/installer_macos_universal.sh"
          "${{ github.workspace }}/installer_macos_universal.sh"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/MetadataCleaner-macOS.dmg

  build-linux:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: "utf-8"
    strategy:
      matrix:
        include:
          - format: "deb"
            script: "installer_linux_deb_universal.sh"
          - format: "rpm"
            script: "installer_linux_rpm_universal.sh"
          - format: "appimage"
            script: "installer_linux_appimage_universal.sh"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            desktop-file-utils \
            fuse \
            rpm \
            alien \
            build-essential

      - name: Install project dependencies
        run: poetry install --no-root

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build Linux application
        run: poetry run python build.py

      - name: Create ${{ matrix.format }} package
        run: |
          chmod +x "${{ github.workspace }}/${{ matrix.script }}"
          "${{ github.workspace }}/${{ matrix.script }}"

      - name: Upload Linux ${{ matrix.format }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.format }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          echo "--- Release files ---"
          ls -lR release

      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="v$(date +%Y%m%d-%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Metadata Cleaner ${{ steps.version.outputs.version }}
          body_path: docs/RELEASE_TEMPLATE.md
          files: release/*
          draft: false
          prerelease: false
