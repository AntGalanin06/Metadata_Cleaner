name: Performance Testing

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Type of benchmark to run'
        required: true
        type: choice
        options:
          - quick
          - full
          - stress
        default: quick

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.1'

jobs:
  # Performance benchmarks
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-perf-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --with dev
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libgtk-3-dev
    
    - name: Prepare test environment
      run: |
        echo "🏗️ Setting up performance test environment..."
        mkdir -p test-data/perf
        
        # Create test files for performance testing
        echo "Creating test files..."
        
        # Small test file (1KB)
        dd if=/dev/zero of=test-data/perf/small-file.bin bs=1024 count=1
        
        # Medium test file (1MB)
        dd if=/dev/zero of=test-data/perf/medium-file.bin bs=1024 count=1024
        
        # Large test file (10MB)
        dd if=/dev/zero of=test-data/perf/large-file.bin bs=1024 count=10240
        
        # Create mock image files with basic structure
        cp test-data/perf/small-file.bin test-data/perf/test-image-small.jpg
        cp test-data/perf/medium-file.bin test-data/perf/test-image-medium.jpg
        cp test-data/perf/large-file.bin test-data/perf/test-image-large.jpg
        
        echo "Test files created:"
        ls -lh test-data/perf/
    
    - name: Run performance tests
      run: |
        echo "🚀 Running performance benchmarks..."
        
        BENCHMARK_TYPE="${{ github.event.inputs.benchmark_type }}"
        if [ -z "$BENCHMARK_TYPE" ]; then
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BENCHMARK_TYPE="full"
          else
            BENCHMARK_TYPE="quick"
          fi
        fi
        
        echo "Benchmark type: $BENCHMARK_TYPE"
        
        case "$BENCHMARK_TYPE" in
          "quick")
            echo "Running quick performance tests..."
            poetry run pytest tests/test_performance.py::TestPerformance::test_single_file_processing_time \
                                                        tests/test_performance.py::TestPerformance::test_memory_usage_stability \
                                                        -m slow -v --tb=short \
                                                        --benchmark-json=benchmark-results.json
            ;;
          "full")
            echo "Running full performance test suite..."
            poetry run pytest tests/test_performance.py -m slow -v --tb=short \
                                                        --benchmark-json=benchmark-results.json
            ;;
          "stress")
            echo "Running stress tests..."
            poetry run pytest tests/test_performance.py::TestPerformance::test_stress_test_many_files \
                                                        tests/test_performance.py::TestPerformance::test_concurrent_processing \
                                                        -m slow -v --tb=short \
                                                        --benchmark-json=benchmark-results.json
            ;;
        esac
    
    - name: Generate performance report
      if: always()
      run: |
        echo "📊 Generating performance report..."
        
        cat > performance-report.md << EOF
        # Performance Test Report
        
        **Date:** $(date)
        **Branch:** ${{ github.ref_name }}
        **Commit:** ${{ github.sha }}
        **Benchmark Type:** ${BENCHMARK_TYPE:-quick}
        **Python Version:** ${{ env.PYTHON_VERSION }}
        
        ## System Information
        
        - **OS:** $(uname -s) $(uname -r)
        - **CPU:** $(nproc) cores
        - **Memory:** $(free -h | grep '^Mem:' | awk '{print $2}')
        - **Disk:** $(df -h . | tail -1 | awk '{print $4}') available
        
        ## Test Results
        
        EOF
        
        # Add benchmark results if available
        if [ -f "benchmark-results.json" ]; then
          echo "### Benchmark Results" >> performance-report.md
          echo "" >> performance-report.md
          echo "See attached JSON file for detailed timing information." >> performance-report.md
          echo "" >> performance-report.md
          
          # Extract summary info
          if command -v jq >/dev/null 2>&1; then
            echo "**Total Tests:** $(jq '.benchmarks | length' benchmark-results.json)" >> performance-report.md
            echo "" >> performance-report.md
          fi
        fi
        
        echo "## Memory Usage" >> performance-report.md
        echo "" >> performance-report.md
        echo "Memory usage during test execution:" >> performance-report.md
        echo "\`\`\`" >> performance-report.md
        free -h >> performance-report.md
        echo "\`\`\`" >> performance-report.md
        
        echo "" >> performance-report.md
        echo "## Recommendations" >> performance-report.md
        echo "" >> performance-report.md
        echo "1. Monitor memory usage trends over time" >> performance-report.md
        echo "2. Investigate any significant performance regressions" >> performance-report.md
        echo "3. Consider optimization for any tests taking >5 seconds" >> performance-report.md
        echo "4. Update performance baselines if intentional changes were made" >> performance-report.md
        
        echo "Performance Report Generated:"
        cat performance-report.md
    
    - name: Upload performance artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results-${{ github.run_id }}
        path: |
          performance-report.md
          benchmark-results.json
        retention-days: 30

  # Memory profiling
  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies and profiling tools
      run: |
        poetry install --with dev
        poetry run pip install memory-profiler pympler psutil
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libgtk-3-dev
    
    - name: Run memory profiling
      run: |
        echo "🧠 Running memory profiling tests..."
        
        # Create a simple memory profiling script
        cat > memory_profile_test.py << 'EOF'
        import psutil
        import time
        import sys
        from pathlib import Path
        
        # Add project root to path
        sys.path.insert(0, str(Path.cwd()))
        
        from metadata_cleaner.cleaner.dispatcher import MetadataDispatcher
        from metadata_cleaner.cleaner.models import OutputMode
        
        def profile_memory_usage():
            """Profile memory usage during metadata processing."""
            process = psutil.Process()
            initial_memory = process.memory_info().rss / 1024 / 1024  # MB
            
            print(f"Initial memory usage: {initial_memory:.2f} MB")
            
            # Create dispatcher
            dispatcher = MetadataDispatcher()
            
            # Create a test file
            test_file = Path("test_memory_profile.txt")
            test_file.write_text("Test content for memory profiling" * 1000)
            
            try:
                memory_readings = []
                
                # Process file multiple times to check for memory leaks
                for i in range(10):
                    current_memory = process.memory_info().rss / 1024 / 1024
                    memory_readings.append(current_memory)
                    print(f"Iteration {i+1}: {current_memory:.2f} MB")
                    
                    # Simulate processing
                    time.sleep(0.1)
                
                final_memory = process.memory_info().rss / 1024 / 1024
                max_memory = max(memory_readings)
                
                print(f"Final memory usage: {final_memory:.2f} MB")
                print(f"Maximum memory usage: {max_memory:.2f} MB")
                print(f"Memory increase: {final_memory - initial_memory:.2f} MB")
                
                # Check for memory leaks (simple heuristic)
                if final_memory > initial_memory * 1.5:
                    print("⚠️ Potential memory leak detected!")
                else:
                    print("✅ Memory usage appears stable")
                
            finally:
                if test_file.exists():
                    test_file.unlink()
        
        if __name__ == "__main__":
            profile_memory_usage()
        EOF
        
        echo "Running memory profiling..."
        poetry run python memory_profile_test.py > memory-profile-output.txt 2>&1
        
        echo "Memory profiling results:"
        cat memory-profile-output.txt
    
    - name: Upload memory profiling results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: memory-profiling-${{ github.run_id }}
        path: |
          memory-profile-output.txt
        retention-days: 14

  # Performance comparison (if baseline exists)
  performance-comparison:
    name: Performance Comparison
    runs-on: ubuntu-latest
    needs: performance-benchmarks
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Download performance results
      uses: actions/download-artifact@v4
      with:
        name: performance-results-${{ github.run_id }}
        path: current-results/
    
    - name: Compare with baseline
      run: |
        echo "📈 Comparing performance with baseline..."
        
        # This is a placeholder for performance comparison logic
        # In a real implementation, you would:
        # 1. Download baseline performance results from the main branch
        # 2. Compare current results with baseline
        # 3. Generate a comparison report
        # 4. Comment on the PR if significant changes are detected
        
        echo "## Performance Comparison" > comparison-report.md
        echo "" >> comparison-report.md
        echo "**Note:** Baseline comparison not implemented yet." >> comparison-report.md
        echo "" >> comparison-report.md
        echo "Current performance results are available in the artifacts." >> comparison-report.md
        echo "" >> comparison-report.md
        echo "### Implementation Notes" >> comparison-report.md
        echo "To implement performance comparison:" >> comparison-report.md
        echo "1. Store baseline performance results" >> comparison-report.md
        echo "2. Compare timing and memory metrics" >> comparison-report.md
        echo "3. Alert on regressions > 10%" >> comparison-report.md
        echo "4. Generate visual charts" >> comparison-report.md
        
        cat comparison-report.md
    
    - name: Upload comparison report
      uses: actions/upload-artifact@v4
      with:
        name: performance-comparison-${{ github.run_id }}
        path: comparison-report.md
        retention-days: 14