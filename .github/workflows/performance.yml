name: Performance Testing

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.1'

permissions:
  contents: read

jobs:
  # Performance benchmarks
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-perf-${{ hashFiles('**/pyproject.toml') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --with dev
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Prepare test environment
      run: |
        mkdir -p test_data
        echo "Setting up performance test environment..."
    
    - name: Run performance tests
      run: |
        echo "🚀 Running performance benchmarks..."
        poetry run pytest tests/test_performance.py -m slow -v --tb=short || true
    
    - name: Generate performance report
      run: |
        echo "# Performance Test Results" > performance-report.md
        echo "" >> performance-report.md
        echo "Generated on: $(date)" >> performance-report.md
        echo "" >> performance-report.md
        if [ -f benchmark-results.json ]; then
          echo "Benchmark results saved to benchmark-results.json"
        else
          echo "No benchmark results generated"
        fi
    
    - name: Upload performance artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results-${{ github.run_id }}
        path: |
          benchmark-results.json
          performance-report.md
        retention-days: 30

  # Memory profiling  
  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up job
      run: echo "Starting memory profiling job"
    
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies and profiling tools
      run: |
        poetry install --with dev
        # Memory profiling tools can be added here if needed
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Run memory profiling
      run: |
        echo "🧠 Running memory profiling..."
        # Add memory profiling tests here when available
        echo "Memory profiling setup complete"
    
    - name: Upload memory profiling results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: memory-profiling-${{ github.run_id }}
        path: |
          memory-profile.txt
        retention-days: 30

  # Performance comparison
  performance-comparison:
    name: Performance Comparison
    runs-on: ubuntu-latest
    needs: [benchmarks]
    if: always()
    
    steps:
    - name: Performance comparison analysis
      run: |
        echo "📊 Performance Comparison:"
        echo "This job was skipped"
        echo "Performance comparison will be implemented in future updates"
    
    - name: Complete job
      run: echo "Performance testing pipeline completed"