name: CI Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.8.3'

jobs:
  # Code Quality and Security
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: |
        poetry lock --no-update
        poetry install --with dev
    
    - name: Check code formatting with Black
      run: poetry run black --check --diff .
    
    - name: Lint with Ruff
      run: poetry run ruff check . --output-format=github
    
    - name: Type checking with mypy
      run: poetry run mypy metadata_cleaner/ || true
    
    - name: Security scan with Bandit
      run: |
        poetry run bandit -r metadata_cleaner/ -f json -o bandit-report.json -c .bandit || true
        poetry run bandit -r metadata_cleaner/ --severity-level medium -c .bandit || true
    
    - name: Dependency vulnerability scan
      run: |
        poetry run safety check --json > safety-report.json || true
        poetry run safety check || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  # Unit and Integration Tests
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies (Linux/macOS)
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true' && matrix.os != 'windows-latest'
      run: |
        poetry lock --no-update
        poetry install --with dev
    
    - name: Install dependencies (Windows)
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true' && matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Write-Host "Setting up Poetry for Windows..."
        
        # Install Poetry via pip
        python -m pip install poetry==${{ env.POETRY_VERSION }}
        
        # Try multiple ways to find Poetry
        $poetryPath = $null
        
        # Method 1: Try pip installation path
        $pipPoetryPath = python -c "import sys; import os; print(os.path.join(os.path.dirname(sys.executable), 'Scripts', 'poetry.exe'))"
        if (Test-Path $pipPoetryPath) {
          $poetryPath = $pipPoetryPath
          Write-Host "Found Poetry at: $poetryPath"
        }
        
        # Method 2: Try poetry command directly
        if (-not $poetryPath) {
          try {
            $poetryVersion = poetry --version 2>$null
            if ($LASTEXITCODE -eq 0) {
              $poetryPath = "poetry"
              Write-Host "Poetry found in PATH"
            }
          }
          catch {
            Write-Host "Poetry not found in PATH"
          }
        }
        
        # Method 3: Try common Poetry installation paths
        if (-not $poetryPath) {
          $commonPaths = @(
            "$env:USERPROFILE\.local\bin\poetry.exe",
            "$env:APPDATA\Python\Scripts\poetry.exe",
            "$env:USERPROFILE\AppData\Roaming\Python\Scripts\poetry.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python*\Scripts\poetry.exe"
          )
          
          foreach ($path in $commonPaths) {
            $expandedPath = [System.Environment]::ExpandEnvironmentVariables($path)
            if (Test-Path $expandedPath) {
              $poetryPath = $expandedPath
              Write-Host "Found Poetry at: $poetryPath"
              break
            }
          }
        }
        
        # Use Poetry to install dependencies
        if ($poetryPath -eq "poetry") {
          Write-Host "Using Poetry from PATH"
          poetry lock --no-update
          poetry install --with dev
          poetry --version
        } else {
          Write-Host "Using Poetry from: $poetryPath"
          if (Test-Path $poetryPath) {
            & $poetryPath lock --no-update
            & $poetryPath install --with dev
            & $poetryPath --version
          } else {
            Write-Error "Poetry not found at: $poetryPath"
            exit 1
          }
        }
    

    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libgtk-3-dev
    
    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install ffmpeg
    
    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        # Use Chocolatey with retry mechanism for better reliability
        $ErrorActionPreference = "Stop"
        $maxRetries = 3
        $retryCount = 0
        
        do {
          try {
            choco install ffmpeg -y --no-progress
            Write-Host "FFmpeg installed successfully"
            break
          }
          catch {
            $retryCount++
            if ($retryCount -ge $maxRetries) {
              Write-Error "Failed to install FFmpeg after $maxRetries attempts: $_"
              throw
            }
            Write-Warning "FFmpeg installation failed (attempt $retryCount/$maxRetries): $_"
            Start-Sleep -Seconds 10
          }
        } while ($retryCount -lt $maxRetries)
    
    - name: Set Windows encoding (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        echo "PYTHONIOENCODING=utf-8" >> $env:GITHUB_ENV
        echo "PYTHONUTF8=1" >> $env:GITHUB_ENV
    
    - name: Run tests with coverage (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        poetry run pytest --cov=metadata_cleaner --cov-report=xml --cov-report=term-missing --junitxml=pytest.xml
    
    - name: Run tests with coverage (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        # Try multiple ways to find Poetry
        $poetryPath = $null
        
        # Method 1: Try pip installation path
        $pipPoetryPath = python -c "import sys; import os; print(os.path.join(os.path.dirname(sys.executable), 'Scripts', 'poetry.exe'))"
        if (Test-Path $pipPoetryPath) {
          $poetryPath = $pipPoetryPath
          Write-Host "Found Poetry at: $poetryPath"
        }
        
        # Method 2: Try common Poetry installation paths
        if (-not $poetryPath) {
          $commonPaths = @(
            "$env:USERPROFILE\.local\bin\poetry.exe",
            "$env:APPDATA\Python\Scripts\poetry.exe",
            "$env:USERPROFILE\AppData\Roaming\Python\Scripts\poetry.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python*\Scripts\poetry.exe"
          )
          
          foreach ($path in $commonPaths) {
            $expandedPath = [System.Environment]::ExpandEnvironmentVariables($path)
            if (Test-Path $expandedPath) {
              $poetryPath = $expandedPath
              Write-Host "Found Poetry at: $poetryPath"
              break
            }
          }
        }
        
        # Method 3: Try poetry command directly
        if (-not $poetryPath) {
          try {
            $poetryVersion = poetry --version 2>$null
            if ($LASTEXITCODE -eq 0) {
              $poetryPath = "poetry"
              Write-Host "Poetry found in PATH"
            }
          }
          catch {
            Write-Host "Poetry not found in PATH"
          }
        }
        
        # Method 4: Install Poetry if not found
        if (-not $poetryPath) {
          Write-Host "Installing Poetry..."
          python -m pip install poetry==${{ env.POETRY_VERSION }}
          $poetryPath = python -c "import sys; import os; print(os.path.join(os.path.dirname(sys.executable), 'Scripts', 'poetry.exe'))"
          Write-Host "Installed Poetry at: $poetryPath"
        }
        
        # Verify Poetry is accessible
        if ($poetryPath -eq "poetry") {
          Write-Host "Using Poetry from PATH"
          poetry run pytest --cov=metadata_cleaner --cov-report=xml --cov-report=term-missing --junitxml=pytest.xml || true
        } else {
          Write-Host "Using Poetry from: $poetryPath"
          if (Test-Path $poetryPath) {
            & $poetryPath run pytest --cov=metadata_cleaner --cov-report=xml --cov-report=term-missing --junitxml=pytest.xml || true
          } else {
            Write-Error "Poetry not found at: $poetryPath"
            exit 1
          }
        }
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          pytest.xml
          coverage.xml
        retention-days: 30