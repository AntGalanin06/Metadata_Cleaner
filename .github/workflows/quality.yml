name: Code Quality

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.1'

permissions:
  contents: read
  pull-requests: write

jobs:
  # Качество кода
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-quality-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --with dev
    
    - name: Check code formatting with Black
      run: |
        echo "🎨 Checking code formatting..."
        poetry run black --check --diff metadata_cleaner/ tests/
    
    - name: Lint with Ruff
      run: |
        echo "🔍 Running Ruff linter..."
        poetry run ruff check metadata_cleaner/ tests/ --output-format=github
    
    - name: Type checking with mypy
      run: |
        echo "🎯 Type checking..."
        poetry run mypy metadata_cleaner/ --ignore-missing-imports || true
    
    - name: Check import sorting
      run: |
        echo "📋 Checking import sorting..."
        poetry run ruff check --select I metadata_cleaner/ tests/ || true
    
    - name: Security scan with Bandit
      run: |
        echo "🔒 Security scanning..."
        poetry run pip install bandit[toml]
        poetry run bandit -r metadata_cleaner/ -f json -o bandit-report.json || true
        poetry run bandit -r metadata_cleaner/ -ll || true
    
    - name: Dependency vulnerability scan
      run: |
        echo "🛡️ Dependency vulnerability scan..."
        poetry run pip install safety
        poetry run safety check --json --output safety-report.json || true
        poetry run safety check || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-${{ github.run_id }}
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  # Покрытие кода
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-coverage-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --with dev
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libgtk-3-dev
    
    - name: Run tests with coverage
      run: |
        echo "🧪 Running tests with coverage..."
        poetry run pytest \
          --cov=metadata_cleaner \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-branch \
          --junitxml=pytest.xml \
          tests/
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
    
    - name: Coverage comment
      uses: py-cov-action/python-coverage-comment-action@v3
      if: github.event_name == 'pull_request'
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 60
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports-${{ github.run_id }}
        path: |
          htmlcov/
          coverage.xml
          pytest.xml
        retention-days: 30

  # Анализ метрик кода
  metrics:
    name: Code Metrics
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install analysis tools
      run: |
        pip install radon xenon vulture
    
    - name: Calculate code metrics
      run: |
        echo "📊 Code Metrics Analysis"
        echo "========================"
        
        echo "📏 Lines of Code:"
        find metadata_cleaner -name "*.py" -exec wc -l {} + | tail -1
        
        echo ""
        echo "🔢 Cyclomatic Complexity:"
        radon cc metadata_cleaner -a -nc
        
        echo ""
        echo "🏗️ Maintainability Index:"
        radon mi metadata_cleaner -nc
        
        echo ""
        echo "📈 Raw Metrics:"
        radon raw metadata_cleaner -s
        
        echo ""
        echo "🔍 Dead Code Detection:"
        vulture metadata_cleaner --min-confidence 60 || true
    
    - name: Generate metrics report
      run: |
        echo "# Code Metrics Report" > metrics-report.md
        echo "" >> metrics-report.md
        echo "## Complexity Analysis" >> metrics-report.md
        echo "\`\`\`" >> metrics-report.md
        radon cc metadata_cleaner -a >> metrics-report.md || true
        echo "\`\`\`" >> metrics-report.md
        echo "" >> metrics-report.md
        echo "## Maintainability" >> metrics-report.md
        echo "\`\`\`" >> metrics-report.md
        radon mi metadata_cleaner >> metrics-report.md || true
        echo "\`\`\`" >> metrics-report.md
    
    - name: Upload metrics report
      uses: actions/upload-artifact@v4
      with:
        name: metrics-report-${{ github.run_id }}
        path: metrics-report.md
        retention-days: 30

  # Проверка документации
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check README files
      run: |
        echo "📚 Checking documentation..."
        
        if [ ! -f README.md ]; then
          echo "❌ README.md not found"
          exit 1
        fi
        
        if [ ! -f README_EN.md ]; then
          echo "❌ README_EN.md not found" 
          exit 1
        fi
        
        echo "✅ README files found"
    
    - name: Check docstrings
      run: |
        echo "📝 Checking docstrings..."
        
        # Подсчет функций без docstrings
        missing_docstrings=$(find metadata_cleaner -name "*.py" | wc -l)
        
        echo "Functions without docstrings: $missing_docstrings"
        
        if [ "$missing_docstrings" -gt 20 ]; then
          echo "⚠️ Many functions missing docstrings"
        else
          echo "✅ Docstring coverage acceptable"
        fi
    
    - name: Check for TODO/FIXME comments
      run: |
        echo "🔍 Checking for TODO/FIXME comments..."
        
        todos=$(grep -r "TODO\|FIXME\|XXX\|HACK" metadata_cleaner || true)
        if [ -n "$todos" ]; then
          echo "⚠️ Found TODO/FIXME comments:"
          echo "$todos"
        else
          echo "✅ No TODO/FIXME comments found"
        fi

  # Финальная проверка качества
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [code-quality, coverage, metrics, docs-check]
    if: always()
    
    steps:
    - name: Check quality gate
      run: |
        echo "🚦 Quality Gate Summary"
        echo "======================"
        
        CODE_QUALITY="${{ needs.code-quality.result }}"
        COVERAGE="${{ needs.coverage.result }}"
        METRICS="${{ needs.metrics.result }}"
        DOCS="${{ needs.docs-check.result }}"
        
        echo "Code Quality: $CODE_QUALITY"
        echo "Coverage: $COVERAGE" 
        echo "Metrics: $METRICS"
        echo "Documentation: $DOCS"
        
        if [ "$CODE_QUALITY" = "success" ] && [ "$COVERAGE" = "success" ]; then
          echo "✅ Quality gate PASSED"
          exit 0
        else
          echo "❌ Quality gate FAILED"
          exit 1
        fi