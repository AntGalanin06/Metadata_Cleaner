name: Code Quality

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.8.3'

permissions:
  contents: read
  pull-requests: write

jobs:
  # Качество кода
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-quality-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: |
        poetry lock --no-update
        poetry install --with dev
    
    - name: Check code formatting with Black
      run: |
        echo "🎨 Checking code formatting..."
        poetry run black --check --diff .
    
    - name: Lint with Ruff
      run: |
        echo "🔍 Running Ruff linter..."
        poetry run ruff check . --output-format=github
    
    - name: Type checking with mypy
      run: |
        echo "🎯 Type checking..."
        poetry run mypy metadata_cleaner/ --ignore-missing-imports --no-error-summary || true
    
    - name: Security scan with Bandit
      run: |
        echo "🔒 Security scanning..."
        poetry run bandit -r metadata_cleaner/ -f json -o bandit-report.json -c .bandit || true
        poetry run bandit -r metadata_cleaner/ -ll -c .bandit || true
    
    - name: Dependency vulnerability scan
      run: |
        echo "🛡️ Dependency vulnerability scan..."
        poetry run safety check --json > safety-report.json || true
        poetry run safety check || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-quality-${{ github.run_id }}
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  # Анализ метрик кода
  metrics:
    name: Code Metrics
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-metrics-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: |
        poetry lock --no-update
        poetry install --with dev
    
    - name: Run code metrics analysis
      run: |
        echo "📊 Code Metrics Analysis:"
        echo ""
        echo "🔢 Cyclomatic Complexity:"
        poetry run radon cc metadata_cleaner -a -nc
        
        echo ""
        echo "🏢️ Maintainability Index:"
        poetry run radon mi metadata_cleaner -nc
        
        echo ""
        echo "📈 Raw Metrics:"
        poetry run radon raw metadata_cleaner -s
    
    - name: Generate metrics report
      run: |
        echo "# Code Quality Report" > metrics-report.md
        echo "" >> metrics-report.md
        echo "## Cyclomatic Complexity" >> metrics-report.md
        poetry run radon cc metadata_cleaner -a >> metrics-report.md || true
        echo "" >> metrics-report.md
        echo "## Maintainability Index" >> metrics-report.md
        poetry run radon mi metadata_cleaner >> metrics-report.md || true
    
    - name: Upload metrics report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: metrics-report-${{ github.run_id }}
        path: metrics-report.md
        retention-days: 30

  # Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [code-quality, metrics]
    if: always()
    
    steps:
    - name: Check quality gate
      run: |
        CODE_QUALITY_STATUS="${{ needs.code-quality.result }}"
        METRICS_STATUS="${{ needs.metrics.result }}"
        
        echo "📊 Quality Gate Results:"
        echo "- Code Quality: $CODE_QUALITY_STATUS"
        echo "- Metrics: $METRICS_STATUS"
        
        if [[ "$CODE_QUALITY_STATUS" == "failure" ]]; then
          echo "❌ Quality gate failed: Code quality checks failed"
          exit 1
        fi
        
        if [[ "$METRICS_STATUS" == "failure" ]]; then
          echo "⚠️ Quality gate warning: Metrics analysis failed"
          # Don't fail the build for metrics, just warn
        fi
        
        echo "✅ Quality gate passed!"